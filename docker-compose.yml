services:
  app:
    build: ./backend
    container_name: siksha-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      - GEMINI_API_KEY=AIzaSyBQmrjLg3GbLqeuENLsc5Jogb_DfaVRnwc
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15-alpine
    container_name: siksha-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: siksha_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siksha_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - siksha-db-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: siksha-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@siksha.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  siksha-db-data:
