# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
# Increased memory and Metaspace to handle large dependency graphs.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Disable parallel execution and limit workers to prevent InterruptedException caused by resource contention.
org.gradle.parallel=false
org.gradle.workers.max=4

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Reduces the size of the R class
android.nonTransitiveRClass=true

# Stabilize dexing by disabling parallel transforms which can be flaky in some environments.
android.enableDexingArtifactTransform.parallel=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Disable KSP2 to avoid "unexpected jvm signature V" error
ksp.useKSP2=false
