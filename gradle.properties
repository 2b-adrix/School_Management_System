# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
# Lowered Gradle heap to 2GB to leave enough system memory for Kotlin/KSP daemons.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Specific JVM arguments for the Kotlin daemon and KSP
# These processes are often where the crash occurs during KSP tasks.
kotlin.daemon.jvmargs=-Xmx1536m
ksp.daemon.jvmargs=-Xmx1536m

# Disable parallel execution and limit workers to prevent resource contention.
org.gradle.parallel=false
org.gradle.workers.max=4

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Reduces the size of the R class
android.nonTransitiveRClass=true
